<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>틱택토 ⭕❌</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    margin: 0;
  }

  #scoreboard {
    display: flex;
    gap: 16px;
  }

  #status {
    font-size: 1.5rem;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    grid-template-rows: repeat(3, 80px);
    gap: 4px;
  }

  .cell {
    font-size: 2rem;
  }

  #next-round-btn {
    padding: 8px 16px;
    font-size: 1rem;
  }
</style>
</head>
<body>
  <h1>틱택토 ⭕❌</h1>

  <div id="scoreboard">
    <span id="score-o">O 승: 0</span>
    <span id="score-x">X 승: 0</span>
    <span id="score-draw">무승부: 0</span>
  </div>

  <div id="status" aria-live="polite">지금 차례: O</div>

  <div id="board">
    <button class="cell" data-index="0" aria-label="1행 1열, 빈 칸"></button>
    <button class="cell" data-index="1" aria-label="1행 2열, 빈 칸"></button>
    <button class="cell" data-index="2" aria-label="1행 3열, 빈 칸"></button>
    <button class="cell" data-index="3" aria-label="2행 1열, 빈 칸"></button>
    <button class="cell" data-index="4" aria-label="2행 2열, 빈 칸"></button>
    <button class="cell" data-index="5" aria-label="2행 3열, 빈 칸"></button>
    <button class="cell" data-index="6" aria-label="3행 1열, 빈 칸"></button>
    <button class="cell" data-index="7" aria-label="3행 2열, 빈 칸"></button>
    <button class="cell" data-index="8" aria-label="3행 3열, 빈 칸"></button>
  </div>

  <button id="next-round-btn">다음 판</button>

  <script>
    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // 가로
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // 세로
      [0, 4, 8], [2, 4, 6]             // 대각선
    ];

    const cellEls = Array.from(document.querySelectorAll('.cell'));
    const statusEl = document.getElementById('status');
    const scoreOEl = document.getElementById('score-o');
    const scoreXEl = document.getElementById('score-x');
    const scoreDrawEl = document.getElementById('score-draw');
    const nextRoundBtn = document.getElementById('next-round-btn');

    let board = Array(9).fill(null);
    let currentPlayer = 'O';
    let gameOver = false;
    let score = { O: 0, X: 0, draw: 0 };

    function checkWin() {
      for (const line of WIN_LINES) {
        const [a, b, c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], line };
        }
      }
      return null;
    }

    function isBoardFull() {
      return board.every((cell) => cell !== null);
    }

    function updateStatus(text) {
      statusEl.textContent = text;
    }

    function updateScoreboard() {
      scoreOEl.textContent = `O 승: ${score.O}`;
      scoreXEl.textContent = `X 승: ${score.X}`;
      scoreDrawEl.textContent = `무승부: ${score.draw}`;
    }

    function handleCellClick(index) {
      if (gameOver || board[index] !== null) {
        return;
      }

      board[index] = currentPlayer;
      cellEls[index].textContent = currentPlayer;

      const result = checkWin();
      if (result) {
        gameOver = true;
        score[result.winner] += 1;
        updateScoreboard();
        updateStatus(`${result.winner} 승리!`);
        result.line.forEach((i) => cellEls[i].classList.add('win-cell'));
        return;
      }

      if (isBoardFull()) {
        gameOver = true;
        score.draw += 1;
        updateScoreboard();
        updateStatus('무승부');
        return;
      }

      currentPlayer = currentPlayer === 'O' ? 'X' : 'O';
      updateStatus(`지금 차례: ${currentPlayer}`);
    }

    function startNextRound() {
      board = Array(9).fill(null);
      currentPlayer = 'O';
      gameOver = false;
      cellEls.forEach((cell) => {
        cell.textContent = '';
        cell.classList.remove('win-cell');
      });
      updateStatus(`지금 차례: ${currentPlayer}`);
    }

    cellEls.forEach((cell, index) => {
      cell.addEventListener('click', () => handleCellClick(index));
    });

    nextRoundBtn.addEventListener('click', startNextRound);
  </script>
</body>
</html>
