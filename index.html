<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>틱택토 ⭕❌</title>
<style>
  :root {
    --o-color: #38bdf8;
    --o-color-soft: rgba(56, 189, 248, 0.15);
    --x-color: #fb7185;
    --x-color-soft: rgba(251, 113, 133, 0.15);
    --win-color: #fbbf24;
    --bg-start: #0f172a;
    --bg-end: #1e1b4b;
    --card-bg: rgba(30, 41, 59, 0.65);
    --card-border: rgba(148, 163, 184, 0.18);
    --cell-bg: rgba(255, 255, 255, 0.04);
    --cell-bg-hover: rgba(255, 255, 255, 0.09);
    --text-color: #e2e8f0;
    --muted-color: #94a3b8;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 32px 16px;
    min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #312e81 0%, var(--bg-start) 45%, var(--bg-end) 100%);
    color: var(--text-color);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .card {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(12px);
  }

  h1 {
    margin: 0;
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--o-color), var(--x-color));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #scoreboard {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #scoreboard span {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 6px 14px;
    font-weight: 700;
    font-size: 0.9rem;
  }

  #score-o {
    color: var(--o-color);
  }

  #score-x {
    color: var(--x-color);
  }

  #score-draw {
    color: var(--muted-color);
  }

  #player-legend {
    margin-top: -8px;
    color: var(--muted-color);
    font-size: 0.82rem;
  }

  #status {
    font-size: 1.4rem;
    font-weight: 800;
    min-height: 1.8rem;
    transition: color 0.2s ease;
  }

  #status.game-over {
    color: var(--win-color);
    text-shadow: 0 0 16px rgba(251, 191, 36, 0.5);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(3, 92px);
    grid-template-rows: repeat(3, 92px);
    gap: 8px;
    background: rgba(0, 0, 0, 0.25);
    padding: 8px;
    border-radius: 16px;
    border: 1px solid var(--card-border);
  }

  .cell {
    font-size: 2.5rem;
    font-weight: 800;
    background: var(--cell-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }

  .cell:hover:not(.o-mark):not(.x-mark) {
    background: var(--cell-bg-hover);
    border-color: rgba(148, 163, 184, 0.4);
  }

  .cell.o-mark {
    color: var(--o-color);
    background: var(--o-color-soft);
    text-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    cursor: default;
  }

  .cell.x-mark {
    color: var(--x-color);
    background: var(--x-color-soft);
    text-shadow: 0 0 14px rgba(251, 113, 133, 0.6);
    cursor: default;
  }

  #board.locked .cell:not(.o-mark):not(.x-mark) {
    cursor: default;
  }

  .cell.win-cell {
    border-color: var(--win-color);
    box-shadow: 0 0 18px rgba(251, 191, 36, 0.55);
    animation: pop 0.35s ease;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.14); }
    100% { transform: scale(1); }
  }

  #controls {
    display: flex;
    gap: 10px;
  }

  #next-round-btn,
  #reset-btn {
    padding: 11px 22px;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease, background-color 0.15s ease;
  }

  #next-round-btn {
    color: #0f172a;
    border: none;
    background: linear-gradient(90deg, var(--o-color), #818cf8);
  }

  #next-round-btn:hover {
    transform: translateY(-1px);
    opacity: 0.92;
  }

  #reset-btn {
    color: var(--text-color);
    background: transparent;
    border: 1px solid var(--card-border);
  }

  #reset-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-1px);
  }

  @media (max-width: 380px) {
    .card {
      padding: 22px 16px;
    }

    #board {
      grid-template-columns: repeat(3, 26vw);
      grid-template-rows: repeat(3, 26vw);
    }

    .cell {
      font-size: 8vw;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>틱택토 ⭕❌</h1>

    <div id="scoreboard">
      <span id="score-o">O 승: 0</span>
      <span id="score-x">X 승: 0</span>
      <span id="score-draw">무승부: 0</span>
    </div>

    <div id="player-legend">컴퓨터 = X · 사람 = O</div>

    <div id="status" aria-live="polite">지금 차례: O</div>

    <div id="board">
      <button class="cell" data-index="0" aria-label="1행 1열, 빈 칸"></button>
      <button class="cell" data-index="1" aria-label="1행 2열, 빈 칸"></button>
      <button class="cell" data-index="2" aria-label="1행 3열, 빈 칸"></button>
      <button class="cell" data-index="3" aria-label="2행 1열, 빈 칸"></button>
      <button class="cell" data-index="4" aria-label="2행 2열, 빈 칸"></button>
      <button class="cell" data-index="5" aria-label="2행 3열, 빈 칸"></button>
      <button class="cell" data-index="6" aria-label="3행 1열, 빈 칸"></button>
      <button class="cell" data-index="7" aria-label="3행 2열, 빈 칸"></button>
      <button class="cell" data-index="8" aria-label="3행 3열, 빈 칸"></button>
    </div>

    <div id="controls">
      <button id="next-round-btn">다음 판</button>
      <button id="reset-btn">초기화</button>
    </div>
  </div>

  <script>
    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // 가로
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // 세로
      [0, 4, 8], [2, 4, 6]             // 대각선
    ];

    const cellEls = Array.from(document.querySelectorAll('.cell'));
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const scoreOEl = document.getElementById('score-o');
    const scoreXEl = document.getElementById('score-x');
    const scoreDrawEl = document.getElementById('score-draw');
    const nextRoundBtn = document.getElementById('next-round-btn');
    const resetBtn = document.getElementById('reset-btn');

    const HUMAN = 'O';
    const COMPUTER = 'X';
    const COMPUTER_DELAY_MS = 500;

    let board = Array(9).fill(null);
    let currentPlayer = HUMAN;
    let gameOver = false;
    let score = { O: 0, X: 0, draw: 0 };

    function checkWin() {
      for (const line of WIN_LINES) {
        const [a, b, c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], line };
        }
      }
      return null;
    }

    function isBoardFull() {
      return board.every((cell) => cell !== null);
    }

    function updateStatus(text) {
      statusEl.textContent = text;
    }

    function updateScoreboard() {
      scoreOEl.textContent = `O 승: ${score.O}`;
      scoreXEl.textContent = `X 승: ${score.X}`;
      scoreDrawEl.textContent = `무승부: ${score.draw}`;
    }

    function placeMark(player, index) {
      board[index] = player;
      cellEls[index].textContent = player;
      cellEls[index].classList.add(player === 'O' ? 'o-mark' : 'x-mark');

      const result = checkWin();
      if (result) {
        gameOver = true;
        score[result.winner] += 1;
        updateScoreboard();
        updateStatus(`${result.winner} 승리!`);
        statusEl.classList.add('game-over');
        boardEl.classList.add('locked');
        result.line.forEach((i) => cellEls[i].classList.add('win-cell'));
        return;
      }

      if (isBoardFull()) {
        gameOver = true;
        score.draw += 1;
        updateScoreboard();
        updateStatus('무승부');
        statusEl.classList.add('game-over');
        boardEl.classList.add('locked');
        return;
      }

      currentPlayer = player === 'O' ? 'X' : 'O';
      updateStatus(`지금 차례: ${currentPlayer}`);

      if (!gameOver && currentPlayer === COMPUTER) {
        setTimeout(computerMove, COMPUTER_DELAY_MS);
      }
    }

    function handleCellClick(index) {
      if (gameOver || board[index] !== null || currentPlayer !== HUMAN) {
        return;
      }
      placeMark(HUMAN, index);
    }

    function findWinningMove(player) {
      for (const line of WIN_LINES) {
        const marks = line.map((i) => board[i]);
        const emptyIndex = line[marks.indexOf(null)];
        const playerCount = marks.filter((m) => m === player).length;
        if (playerCount === 2 && marks.includes(null)) {
          return emptyIndex;
        }
      }
      return null;
    }

    function computerMove() {
      if (gameOver) {
        return;
      }

      const emptyIndexes = board
        .map((cell, i) => (cell === null ? i : null))
        .filter((i) => i !== null);

      let index = findWinningMove(COMPUTER);
      if (index === null) {
        index = findWinningMove(HUMAN);
      }
      if (index === null && board[4] === null) {
        index = 4;
      }
      if (index === null) {
        const corners = [0, 2, 6, 8].filter((i) => board[i] === null);
        if (corners.length > 0) {
          index = corners[Math.floor(Math.random() * corners.length)];
        }
      }
      if (index === null) {
        index = emptyIndexes[Math.floor(Math.random() * emptyIndexes.length)];
      }

      placeMark(COMPUTER, index);
    }

    function startNextRound() {
      board = Array(9).fill(null);
      currentPlayer = HUMAN;
      gameOver = false;
      cellEls.forEach((cell) => {
        cell.textContent = '';
        cell.classList.remove('win-cell', 'o-mark', 'x-mark');
      });
      boardEl.classList.remove('locked');
      statusEl.classList.remove('game-over');
      updateStatus(`지금 차례: ${currentPlayer}`);
    }

    function resetGame() {
      score = { O: 0, X: 0, draw: 0 };
      updateScoreboard();
      startNextRound();
    }

    cellEls.forEach((cell, index) => {
      cell.addEventListener('click', () => handleCellClick(index));
    });

    nextRoundBtn.addEventListener('click', startNextRound);
    resetBtn.addEventListener('click', resetGame);
  </script>
</body>
</html>
